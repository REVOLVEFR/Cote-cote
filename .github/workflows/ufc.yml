name: UFC - temoin et candidats

# Enregistre le temoin (cotes 1.01 a 1.30, sans selection, non affiche comme pari)
# et liste les favoris candidats aux avis UFC (jusqu'a 1.50).

on:
  schedule:
    - cron: "0 10 * * 3"   # mercredi, avant les cartes du week-end
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-write
  cancel-in-progress: false

jobs:
  ufc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/cli.mjs ufc
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          UFC_MIN_ODDS: "1.01"
          UFC_MAX_ODDS: "1.30"
          UFC_CANDIDATE_MAX: "1.50"
          MIN_BOOKS: "2"
      - name: Commiter les paris
        run: |
          git config user.name "cote-a-cote"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "UFC : temoin et candidats"
          git push
