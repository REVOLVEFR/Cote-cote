name: Régler les paris terminés

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-write
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/cli.mjs settle
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Commiter s'il y a du changement
        run: |
          git config user.name "cote-a-cote"
          git config user.email "actions@github.com"
          git add data/picks.json
          git diff --staged --quiet || git commit -m "Règlement automatique"
          git push
