name: Publier automatiquement

# REGLE FIGEE le 14 septembre 2026, avant toute observation.
# Probabilite >= 70 %, cote >= 1.25, aucun filtre d'ecart.
# Les valeurs par defaut ne doivent pas etre modifiees : une regle ajustee
# en cours de route ne mesure plus que la capacite a ajuster.

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-write
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/cli.mjs model
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          HORIZON_DAYS: "8"
          MAX_PICKS: "5"
          MIN_EDGE: "-1"
          MIN_PROB: "0.70"
          MIN_ODDS: "1.25"
          MIN_GAMES: "8"
          MIN_BOOKS: "2"
          MAX_SPREAD: "0.06"
      - name: Commiter les paris
        run: |
          git config user.name "cote-a-cote"
          git config user.email "actions@github.com"
          git add data/picks.json
          git diff --staged --quiet || git commit -m "Paris publies par le modele"
          git push
