name: Publier automatiquement

# Suivi erreurs de cote : tous les ecarts positifs entre la meilleure cote
# francaise et le prix equitable Pinnacle, du vendredi au lundi.
# Publie tot le vendredi : les crons GitHub ont deja pris jusqu'a 7 h de retard.

on:
  schedule:
    - cron: "17 5 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-write
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/cli.mjs value
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          VALUE_MIN_ODDS: "1.25"
          VALUE_MAX_ODDS: "3"
      - name: Commiter les paris
        run: |
          git config user.name "cote-a-cote"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Paris publies par le modele"
          git push
