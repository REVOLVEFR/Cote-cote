name: Publier automatiquement

on:
  schedule:
    - cron: "0 9 * * 2"   # mardi 9h UTC, 4 a 5 jours avant les matchs du week-end
  workflow_dispatch:
    inputs:
      horizon_days:
        description: "Fenetre en jours"
        required: false
        default: "8"
      max_picks:
        description: "Nombre maximum de paris"
        required: false
        default: "5"
      min_edge:
        description: "Ecart minimal modele/marche (0.08 = 8%). C'est ce qui fait la rentabilite."
        required: false
        default: "0.08"
      min_prob:
        description: "Probabilite minimale (0.5 = 50%). Reduit la variance, pas le risque de perte."
        required: false
        default: "0.5"

permissions:
  contents: write

concurrency:
  group: picks-write
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/cli.mjs model
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          HORIZON_DAYS: ${{ inputs.horizon_days || '8' }}
          MAX_PICKS: ${{ inputs.max_picks || '5' }}
          MIN_EDGE: ${{ inputs.min_edge || '0.08' }}
          MIN_PROB: ${{ inputs.min_prob || '0.5' }}
      - name: Commiter les paris
        run: |
          git config user.name "cote-a-cote"
          git config user.email "actions@github.com"
          git add data/picks.json
          git diff --staged --quiet || git commit -m "Paris publies par le modele"
          git push
