name: Treve - Ligue des Nations

# Suivi Treve : tous les ecarts positifs entre la meilleure cote francaise
# et le prix equitable Pinnacle, sur les matchs des 4 prochains jours.

on:
  schedule:
    - cron: "41 6 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-write
  cancel-in-progress: false

jobs:
  treve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/cli.mjs treve
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TREVE_DAYS: "4"
      - name: Commiter
        run: |
          git config user.name "cote-a-cote"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Treve : paris publies"
          git push
